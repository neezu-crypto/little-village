<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>little-village</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="viewport">
    <canvas id="worldCanvas"></canvas>

    <div id="rotatePrompt" class="overlay hidden">
      <div class="rotate-icon">⟳</div>
      <p>기기를 가로로 돌려주세요</p>
    </div>

    <button id="exitFullscreenBtn" class="icon-btn hidden" aria-label="나가기">←</button>

    <div id="saveIndicator" aria-hidden="true"></div>
    <div id="tabConflictNotice" class="tab-notice hidden">다른 탭에서 이 마을을 이미 보고 있어요</div>

    <button id="speedBtn" class="icon-btn speed-btn" aria-label="배속 전환">1x</button>
    <button id="journalBtn" class="icon-btn journal-btn" aria-label="발견 일지">📖</button>
    <button id="settingsBtn" class="icon-btn settings-btn" aria-label="설정">⚙️</button>
    <div id="villagerPanel" class="popover hidden"></div>
    <div id="journalPanel" class="journal">
      <div id="journalList"></div>
    </div>

    <div id="itemTray" class="item-tray">
      <button class="item-btn" data-type="bread" aria-label="빵 놓기">🍞</button>
      <button class="item-btn" data-type="apple" aria-label="사과 놓기">🍎</button>
      <button class="item-btn" data-type="chair" aria-label="방석 놓기">🪑</button>
      <button class="item-btn" data-type="parasol" aria-label="그늘막 놓기">⛱</button>
      <button class="item-btn" data-type="letter" aria-label="편지 놓기">✉️</button>
      <button class="item-btn" data-type="flower" aria-label="꽃다발 놓기">💐</button>
      <span id="itemRemaining" class="item-remaining">3</span>
    </div>

    <div id="settingsModal" class="modal-overlay hidden">
      <div class="modal-box">
        <h3>설정</h3>
        <label class="settings-row">
          <span>소리</span>
          <input type="checkbox" id="soundToggle" />
        </label>
        <label class="settings-row">
          <span>애니메이션 줄이기</span>
          <input type="checkbox" id="motionToggle" />
        </label>
        <button id="reenterFullscreenBtn" class="settings-action">전체화면 · 가로모드 다시 켜기</button>
        <button id="resetBtn" class="settings-action danger">새로 시작하기</button>
        <button id="closeSettingsBtn" class="settings-close">닫기</button>
      </div>
    </div>
  </div>

  <script src="data/eras.js"></script>
  <script src="data/world.js"></script>
  <script src="js/village.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/buildingSprites.js"></script>
  <script src="js/objectSprites.js"></script>
  <script src="js/characterSprites.js"></script>
  <script src="js/assetSprites.js"></script>
  <script src="js/names.js"></script>
  <script src="js/render.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/mobile.js"></script>
  <script src="js/time.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/gameSpeed.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/relationships.js"></script>
  <script src="js/dialogue.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/intervention.js"></script>
  <script src="js/villageEvents.js"></script>
  <script src="js/buildingLifecycle.js"></script>
  <script src="js/migration.js"></script>
  <script src="js/villagers.js"></script>
  <script src="js/interactions.js"></script>
  <script src="js/save.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
